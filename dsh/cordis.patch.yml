# dsh-cli-doctor bundle patch.
#
# Inserts the CLI Doctor row into a DSH profile's layer stack. The row is a bare
# plugin by package name: the host half (exports ".") runs in the Host process
# and owns the read-only diagnosis route; the `dsh.client` declaration in
# package.json makes the browser half (exports "./client") load in the Web GUI
# through the host's boot manifest and register the left-sidebar entry plus its
# main panel.
#
# `config` is the plugin's own configuration (whole-object replacement, not a
# deep merge). Every key is optional: lib defaults cover omitted keys
# (see CONTRACT.md v2 §v2.2).
#
# Activate with: dsh plugin --profile <name> add <path-to-this-package>
- insert:
    - id: cli-doctor
      name: dsh-cli-doctor
      config:
        autoCheck: true
        staleAfterHours: 12
        keepHistory: 20
        checkTimeoutMs: 900000
